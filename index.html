<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skolplattform</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f3f5f9;
            color: #1f2933;
        }

        /* Top bar */
        header {
            background: #ffffff;
            border-bottom: 1px solid #dde1e7;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-weight: 600;
            font-size: 20px;
            color: #2563eb;
        }

        nav a {
            margin-left: 16px;
            text-decoration: none;
            color: #2563eb;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Layout */
        .page {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .top-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 32px;
        }

        .welcome,
        .info {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
            flex: 1 1 260px;
            min-width: 260px;
        }

        .welcome h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .welcome p {
            margin-bottom: 12px;
        }

        .btn-primary {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .info h2 {
            margin-top: 0;
            font-size: 18px;
        }

        /* Cards grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.05);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }

            margin-top: 0;
