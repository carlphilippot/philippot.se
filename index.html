<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skolplattform</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f8;
            color: #2c3e50;
        }

        /* Top navigation */
        .navbar {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
        }

        .navbar h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .navbar a {
            margin-left: 20px;
            text-decoration: none;
            color: #1e88e5;
            font-weight: 500;
        }

        /* Main content */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
